global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "spark-dedup"
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - "spark-dedup:4040"

  - job_name: "spark-features"
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - "spark-features:4040"
    
  - job_name: "kafka"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "kafka:7071"