services:

  # -------------------------------------------------------
  # Kafka
  # -------------------------------------------------------

  kafka:
    image: apache/kafka:4.2.0
    container_name: telemetry-kafka

    ports:
      - "9092:9092"
      - "7071:7071"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-1.6.0.jar=7071:/opt/jmx-exporter/jmx-exporter.yml
      
      KAFKA_LISTENERS: >-
        CONTROLLER://:9093,
        INTERNAL://:19092,
        EXTERNAL://:9092
      
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:19092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./monitoring/kafka/jmx_prometheus_javaagent-1.6.0.jar:/opt/jmx-exporter/jmx_prometheus_javaagent-1.6.0.jar:ro
      - ./monitoring/kafka/jmx-exporter.yml:/opt/jmx-exporter/jmx-exporter.yml:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "env -u KAFKA_OPTS /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # -------------------------------------------------------
  # Create Kafka topics
  # -------------------------------------------------------

  kafka-init:
    image: apache/kafka:4.2.0
    
    depends_on:
      kafka:
        condition: service_healthy
        
    command: [
      "/bin/bash", 
      "-c", 
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic raw-telemetry --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic clean-telemetry --partitions 3 --replication-factor 1"
    ]
  # -------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------

  postgres:
    image: postgres:17
    container_name: telemetry-postgres

    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U telemetry -d telemetry"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # -------------------------------------------------------
  # Spark deduplication
  # -------------------------------------------------------

  spark-dedup:
    build:
      context: .
      dockerfile: streaming/Dockerfile

    container_name: telemetry-spark-dedup

    ports:
      - "4040:4040"

    environment:
      KAFKA_BROKER: kafka:19092
      INPUT_TOPIC: raw-telemetry
      OUTPUT_TOPIC: clean-telemetry

      STARTING_OFFSETS: earliest

      CHECKPOINT_LOCATION: /checkpoints/dedup

    volumes:
      - spark-dedup-checkpoint:/checkpoints/dedup

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    command:
      [
        "/opt/spark/bin/spark-submit",

        "--conf",
        "spark.jars.ivy=/tmp/.ivy2.5.2",

        "--conf",
        "spark.ui.port=4040",

        "--conf",
        "spark.sql.streaming.metricsEnabled=true",

        "--conf",
        "spark.metrics.namespace=spark_dedup",

        "--conf",
        "spark.metrics.conf.*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet",

        "--conf",
        "spark.metrics.conf.*.sink.prometheusServlet.path=/metrics/prometheus",

        "--conf",
        "spark.metrics.conf.*.source.jvm.class=org.apache.spark.metrics.source.JvmSource",

        "--packages",
        "org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0",

        "/app/streaming/spark_dedup.py"
      ]


  # -------------------------------------------------------
  # Spark window features → PostgreSQL
  # -------------------------------------------------------

  spark-features:
    build:
      context: .
      dockerfile: streaming/Dockerfile

    container_name: telemetry-spark-features

    ports:
      - "4041:4040"

    environment:
      KAFKA_BROKER: kafka:19092
      KAFKA_TOPIC: clean-telemetry

      STARTING_OFFSETS: earliest

      CHECKPOINT_LOCATION: /checkpoints/features

      POSTGRES_DSN: >-
        postgresql://telemetry:telemetry@postgres:5432/telemetry

      STREAM_QUERY_NAME: window_features_compose_v1

    volumes:
      - spark-features-checkpoint:/checkpoints/features

    depends_on:
      kafka-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

    command:
      [
        "/opt/spark/bin/spark-submit",

        "--conf",
        "spark.jars.ivy=/tmp/.ivy2.5.2",

        "--conf",
        "spark.ui.port=4040",

        "--conf",
        "spark.sql.streaming.metricsEnabled=true",

        "--conf",
        "spark.metrics.namespace=spark_features",

        "--conf",
        "spark.metrics.conf.*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet",

        "--conf",
        "spark.metrics.conf.*.sink.prometheusServlet.path=/metrics/prometheus",

        "--conf",
        "spark.metrics.conf.*.source.jvm.class=org.apache.spark.metrics.source.JvmSource",

        "--packages",
        "org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0",

        "/app/streaming/spark_stream.py"
      ]


  # -------------------------------------------------------
  # Telemetry producer
  # -------------------------------------------------------

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile

    container_name: telemetry-producer

    environment:
      KAFKA_BROKER: kafka:19092
      KAFKA_TOPIC: raw-telemetry

      EVENTS_PER_SECOND: "5"
      ANOMALY_PROBABILITY: "0.03"
      DUPLICATE_PROBABILITY: "0.05"

    depends_on:
      kafka-init:
        condition: service_completed_successfully
  
  # -------------------------------------------------------
  # Prometheus
  # -------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: telemetry-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    # -------------------------------------------------------
  # Grafana
  # -------------------------------------------------------

  grafana:
    image: grafana/grafana:13.2.1
    container_name: telemetry-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

volumes:

  kafka-data:
  postgres-data:

  spark-dedup-checkpoint:
  spark-features-checkpoint:

  prometheus-data:
  grafana-data:

